# What ships is decided by the commit prefix (kindorg-hq/ci v4). Every Python
# package and the Docker base image run in Production, so they are fix(deps)
# and cut a Release; Actions are chore(deps) and ship with the next one.
# Python dev packages (pytest, pytest-django and what they pull in) are
# fix(deps) too: the Dockerfile installs the dev group into /opt/venv, which
# the runtime image copies, so they run in Production and the image scan sees
# them. There is no prefix-development; it can come back once pytest leaves
# the runtime image. Python security updates come as one PR, so advisories
# Dependabot can fix itself land together; a fixable CRITICAL it cannot bump
# (the base image's OS packages, a transitive pip package) still keeps every
# PR red until fixed by hand.
version: 2
updates:
  - package-ecosystem: pip   # Poetry: pyproject.toml + poetry.lock
    directory: /
    schedule: {interval: weekly}
    commit-message:
      prefix: "fix(deps)"
    groups:
      python-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      python-dev:
        dependency-type: development
      python-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: "chore(deps)"}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: "fix(deps)"}
