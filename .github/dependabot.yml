# What ships is decided by the commit prefix (kindorg-hq/ci v4). What the
# shipped image carries runs in Production, so it is fix(deps) and cuts a
# Release: Python runtime packages (Poetry's main group, the only one
# installed in it) and the Docker base image. The dev group (pytest,
# pytest-django and what they pull in) is chore(deps), no Release of its own:
# only the Dockerfile's `dev` stage installs it, for the tests
# (compose.test.yml) and local development; that stage never ships. Actions
# are chore(deps) too. Groups are split by dependency type so a dev bump never
# rides in a runtime PR (a mixed group takes fix(deps)). Python security
# updates come as one PR, so advisories Dependabot can fix in poetry.lock
# (transitive packages included) land together; it takes fix(deps) unless
# every package in it is dev. A fixable CRITICAL it cannot bump still keeps
# every PR red until fixed by hand: a package outside poetry.lock (the base
# image's OS packages, the venv's own pip) or a fix that conflicts with a
# parent's constraint.
version: 2
updates:
  - package-ecosystem: pip   # Poetry: pyproject.toml + poetry.lock
    directory: /
    schedule: {interval: weekly}
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps)"
    groups:
      python-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      python-dev:
        dependency-type: development
      python-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: "chore(deps)"}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: "fix(deps)"}
