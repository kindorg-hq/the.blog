[tool.poetry]
name = "heynik_blog"
version = "0.1.0"
description = ""
authors = ["Nik Ray <hi@nikilyushk.in>"]

[tool.poetry.dependencies]
python = "^3.10"
packaging = ">=24.1"
Django = "^5.2.17"
python-slugify = ">=8,<10"
psycopg2-binary = "^2.9.5"
beautifulsoup4 = "^4.11.1"
mistune = "^3.3.0"
maxminddb-geolite2 = "^2018.703"
requests = "^2.32.4"
Pillow = "^12.1.1"
django-debug-toolbar = ">=5.0.1,<9.0.0"
premailer = "^3.10.0"
lxml = "^6.1.0"
PyJWT = "^2.15.0"
cryptography = "^50.0.0"
gunicorn = ">=22,<27"
uvicorn = {extras = ["standard"], version = "^0.20.0"}
sentry-sdk = "^2.8.0"
Authlib = "^1.6.9"
urllib3 = "^2.8.0"
tzdata = ">=2024.1,<2027.0"
sqlparse = "^0.6.0"
h11 = "^0.16.0"
whitenoise = "^6.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-django (>=4.12.0,<5.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "heynik_blog.settings"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
addopts = "--reuse-db -ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
