# The blog's tests, run by ci v4's Build (`test-compose`) against the image it
# just built: `docker compose -f compose.test.yml run --rm -T test`.
# IMAGE_BLOG is that image (set by ci: the loaded image on a pull request, the
# pushed one by digest on a merge; locally: any blog image you built). It has
# no pytest, so the service `test` is built FROM it: the Dockerfile's `dev`
# stage, which adds only Poetry's dev group. The code tested is the image's.
#
# `test` first waits for `blog`: IMAGE_BLOG itself, booted as Production boots
# it (its own CMD: migrate, then gunicorn with uvicorn workers, ASGI, DEBUG
# off). Then pytest (Django's test client) and tests/boot_smoke.py (real HTTP
# against `blog`); `test` fails if the image doesn't boot or a page isn't 200.
services:
  postgres:
    # postgres:16-alpine, multi-arch (Build runs on arm64)
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vas3k_blog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vas3k_blog"]
      interval: 2s
      retries: 30
  blog:
    # the image under test as is: no command, no build; ci has it already
    # (loaded on a pull request, pulled by digest on a merge), so never pulled
    image: ${IMAGE_BLOG:?set by ci}
    pull_policy: never
    environment:
      DEBUG: "false"
      SECRET_KEY: not-a-secret-ci-boot-smoke
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vas3k_blog
      # Production boots with Sentry's DjangoIntegration (settings: a DSN and
      # DEBUG off); so does this, with a DSN nothing listens on (port 9,
      # discard): events are dropped, nothing leaves the run
      SENTRY_DSN: http://public@127.0.0.1:9/1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # healthy = gunicorn answers `/` on :8022 (Host localhost, as
      # Production's probes ask), whatever the status (migrate runs first, so
      # this also waits for it); the pages' status is boot_smoke.py's to judge
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.error, urllib.request
          request = urllib.request.Request("http://127.0.0.1:8022/", headers={"Host": "localhost"})
          try:
              urllib.request.urlopen(request, timeout=2)
          except urllib.error.HTTPError:
              pass
      interval: 2s
      timeout: 5s
      retries: 60
  test:
    # no `image:` here: it would tag this build as IMAGE_BLOG
    build:
      context: .
      target: dev
      args:
        IMAGE_BLOG: ${IMAGE_BLOG:?set by ci}
    environment:
      DEBUG: "true"
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vas3k_blog
      BLOG_URL: http://blog:8022
    depends_on:
      postgres:
        condition: service_healthy
      blog:
        condition: service_healthy
    # both run, the exit code is non-zero if either failed
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput || exit 1
        python -m pytest -p no:cacheprovider --tb=short -q; tests=$$?
        python -m tests.boot_smoke; smoke=$$?
        [ "$$tests" = 0 ] && [ "$$smoke" = 0 ]
