# The blog's tests, run by ci v4's Build (`test-compose`) against the image it
# just built: `docker compose -f compose.test.yml run --rm -T test`.
# IMAGE_BLOG is that image (set by ci; locally: any blog image you built).
# The image carries pytest (the Dockerfile installs the dev group).
services:
  postgres:
    # postgres:16-alpine, multi-arch (Build runs on arm64)
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vas3k_blog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vas3k_blog"]
      interval: 2s
      retries: 30
  test:
    image: ${IMAGE_BLOG:?set by ci}
    environment:
      DEBUG: "true"
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vas3k_blog
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && python -m pytest -p no:cacheprovider --tb=short -q"]
